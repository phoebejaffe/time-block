name = "time-blocking"
description = "Google Calendar time-blocking planner with local task stacks"
icon = "🗓️"
category = "tools"
autostart = "on-demand"

[[process]]
name = "dev"
type = "service"
runtime = "shell"
cmd = "npm run dev -- --host 127.0.0.1 --port $PORT"
port = 3410
port_range = [3410, 3419]
health = "http://127.0.0.1:3410/"

[[process]]
name = "build"
type = "command"
runtime = "shell"
cmd = "npm run build"

[[process]]
name = "preview"
type = "command"
runtime = "shell"
cmd = "npm run preview -- --host 127.0.0.1 --port 4410"
